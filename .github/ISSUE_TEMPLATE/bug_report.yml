name: Bug report
description: Visual glitch, crash, audio issue, or anything that doesn't behave as expected
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening: search existing issues for your GPU/error first, it may already be tracked.

  - type: input
    id: version
    attributes:
      label: Runtime build SHA256 and launcher revision
      description: Copy runtime_sha256 from bin/runtime-build.json or out/runtime-build.json, plus the source commit or package build ID.
      placeholder: "Runtime SHA256; source commit or package build ID"
    validations:
      required: true

  - type: input
    id: gpu
    attributes:
      label: GPU and driver version
      placeholder: "RX 6600, Adrenalin 26.8.1"
    validations:
      required: true

  - type: input
    id: cpu
    attributes:
      label: CPU
      placeholder: "Ryzen 7 5700X"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened
      description: What you expected vs what actually happened
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Runtime record and session log
      description: Attach the matching last-run.json and boot/session log from user/order1886/logs. Remove private paths; do not attach game binaries or saves.
    validations:
      required: false

  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or video
      description: Especially for visual glitches, attach the raw in-game capture, not a photo of the screen when possible.
    validations:
      required: false
