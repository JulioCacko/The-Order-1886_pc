name: Game won't launch / crashes on startup
description: Black screen, instant close, "prepare failed", param.sfo errors, etc.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        This is experimental compatibility software; a startup failure can be a runtime defect.
        Check the README and current status report, confirm the game folder layout,
        and include the exact failure evidence rather than assuming the dump is at fault.

  - type: input
    id: version
    attributes:
      label: Runtime build SHA256
      placeholder: SHA256 from bin/runtime-build.json or out/runtime-build.json
    validations:
      required: true

  - type: input
    id: game_version
    attributes:
      label: Game build / update version
      description: Copy TITLE_ID, APP_VER and VERSION from the Order diagnostics (for example CUSA00076).
    validations:
      required: true

  - type: textarea
    id: folder
    attributes:
      label: Selected game folder
      description: Screenshot of the folder you pointed the launcher at, showing eboot.bin, sce_sys and sce_module.
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Exact error message
      description: Copy the full text shown by the launcher or the game window, don't paraphrase it.
    validations:
      required: true

  - type: textarea
    id: log
    attributes:
      label: Runtime record and log under user/order1886/logs
      description: Attach the matching last-run.json and boot/session log. Remove private paths; do not upload game binaries or saves.
    validations:
      required: true
