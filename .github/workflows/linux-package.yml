name: The Order 1886 experimental Linux package

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    timeout-minutes: 90
    env:
      DEBIAN_FRONTEND: noninteractive
      CC: clang
      CXX: clang++
      ORDER1886_LTO: 'OFF'
      ORDER1886_PGO: 'off'
      CMAKE_BUILD_PARALLEL_LEVEL: '2'
    steps:
      - name: Install native and desktop-test dependencies
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates cmake ninja-build clang pkg-config \
            libsdl3-dev libvulkan-dev libvulkan-memory-allocator-dev libfmt-dev libboost-dev \
            robin-map-dev libxxhash-dev libavformat-dev libavcodec-dev libavutil-dev \
            libswscale-dev libswresample-dev libzydis-dev glslang-tools spirv-tools \
            spirv-headers libspirv-cross-c-shared-dev libx11-dev mesa-vulkan-drivers \
            python3-venv python3-tk xvfb xauth
      - uses: actions/checkout@v4
        with:
          submodules: false
      - name: Initialize native submodules
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule update --init --recursive -- gpu/third_party/imgui \
            gpu/third_party/magic_enum gpu/third_party/miniz gpu/third_party/xbyak third_party/LibAtrac9
      - name: Build native runtime and run configured CPU checks
        run: bash build.sh --test
      - name: Build environment and Python tests
        run: |
          python3 -m venv out/linux-pyenv
          out/linux-pyenv/bin/python -m pip install pyinstaller==6.20.0 pillow==12.3.0 iced-x86
          xvfb-run -a out/linux-pyenv/bin/python -m unittest discover -s tests
      - name: Package and verify relocated bootstrap
        run: |
          out/linux-pyenv/bin/python packaging/linux/order1886-package.py
          package=$(find dist/order1886-linux -mindepth 2 -maxdepth 2 -type d -name 'The Order 1886' | head -1)
          test -n "$package"
          xvfb-run -a out/linux-pyenv/bin/python packaging/linux/order1886-smoke.py "$package" --output out/linux-smoke
      - uses: actions/upload-artifact@v4
        with:
          name: order1886-linux-x86_64-experimental
          path: |
            dist/order1886-linux/*/order1886-linux-x86_64.tar.gz
            dist/order1886-linux/*/order1886-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
      - name: Preserve build and bootstrap evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: order1886-linux-evidence
          path: |
            out/gpu-build.log
            out/runtime-build.json
            out/linux-smoke/**/smoke-report.json
            out/linux-smoke/**/*.log
          if-no-files-found: warn
