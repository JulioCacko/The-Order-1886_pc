name: Go launcher preview checks
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'launcher-go/**'
      - 'launcher/order1886_*.py'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/order1886-go-preview.yml'
  push:
    paths:
      - 'launcher-go/**'
      - 'launcher/order1886_*.py'
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/order1886-go-preview.yml'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher-go/go.mod
          cache-dependency-path: launcher-go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: launcher-go/frontend/package-lock.json
      - name: Worker and save regressions
        run: |
          # The worker decrypts trophy text with the same pinned package the launcher ships.
          python -m pip install --disable-pip-version-check 'cryptography==50.0.1'
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_order1886_worker.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_order1886_trophy_history.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -p test_order1886_input.py
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          # Save restore moved into the worker protocol; the Tk save-selection window is gone.
          python -m unittest discover -s tests -p test_order1886_worker_protocol.py
      - name: Frontend checks
        working-directory: launcher-go/frontend
        run: |
          npm ci
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm test
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          npm audit --audit-level=high
      - name: Go protocol and application checks
        working-directory: launcher-go
        run: |
          go test ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go vet ./...
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          go run github.com/wailsapp/wails/v2/cmd/wails@v2.17.0 build -clean -skipbindings
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: launcher-go/go.mod
          cache-dependency-path: launcher-go/go.sum
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: launcher-go/frontend/package-lock.json
      # gofmt runs here because this checkout is LF by construction; a Windows runner defaults
      # to CRLF and would flag every file. .gitattributes keeps the two consistent.
      - name: Go formatting
        working-directory: launcher-go
        run: test -z "$(gofmt -l .)" || { gofmt -l .; echo 'gofmt required'; exit 1; }
      # The race detector needs cgo, which the Windows job cannot assume; the documented gate
      # list asks for it, so it runs where the toolchain is guaranteed.
      - name: Frontend build for the embedded assets
        working-directory: launcher-go/frontend
        run: |
          npm ci
          npm run build
      - name: Go race detector
        working-directory: launcher-go
        run: go test ./... -race -count=1

