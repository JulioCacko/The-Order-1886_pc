name: Sparse backing read regressions
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/runtime_memory.c'
      - 'gpu/shim/ps4gpu.cpp'
      - 'gpu/shim/core/emulator_settings.h'
      - 'gpu/shim/ps4_frame_trace.h'
      - 'gpu/shadps4/video_core/amdgpu/liverpool.cpp'
      - 'gpu/shadps4/core/libraries/videoout/driver.cpp'
      - 'tests/test_order1886_gpu_cpu_stats.py'
      - 'gpu/shadps4/video_core/buffer_cache/**'
      - 'order1886.py'
      - 'launcher/order1886_*.py'
      - 'tests/test_selective_readbacks.cpp'
      - 'tests/test_order1886_readback_policy.py'
      - 'tests/test_order1886_performance_capture.py'
      - 'tests/test_memory_read_backing.c'
      - 'tests/test_memory_ownership.c'
      - 'tests/test_order1886_read_backing.py'
      - '.github/workflows/order1886-memory-regressions.yml'
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Install header-test dependencies
        run: sudo apt-get update && sudo apt-get install -y libfmt-dev libboost-dev
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Compile and exercise the production memory reader and upload shim
        env:
          CC: clang
          CXX: clang++
        run: |
          python -m unittest discover -s tests -p test_order1886_read_backing.py -v
          python -m unittest discover -s tests -p test_order1886_readback_policy.py -v
          python -m unittest discover -s tests -p test_order1886_performance_capture.py -v
          python -m unittest discover -s tests -p test_order1886_gpu_cpu_stats.py -v
